name: ecole_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.2.*
  - torchvision=0.17.*
  - torchaudio=2.2.*
  - pytorch-cuda=12.4
  - cudnn=8.9
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - h5py
  - tqdm
  - tensorflow
  - pip
  - pip:
      - axial-positional-embedding==0.2.1
      - keras-metrics==1.1.0
      - linear-attention-transformer==0.15.0
      - linformer==0.2.0
      - linformer-pytorch==0.19.3
      - local-attention==1.1.1
      - product-key-memory==0.1.10
      - sentencepiece==0.1.94
      - tokenizers==0.9.2
